name: Update blocklist

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest
      - name: Update blocklist
        run: uv run update-blocklist
      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update pfBlockerNG blocklist"
          title: "Update pfBlockerNG blocklist"
          body: "Automated source feed refresh."
          branch: "automation/update-blocklist"
          delete-branch: true
